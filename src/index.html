<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Critter Sounds</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="desk-boot.js"></script>
<script src="homebase.js"></script>
<script src="musicfx.js"></script>
</head>
<body>
<!-- the window's title bar: the window is frameless, so the page draws Critter VTT's kind of bar itself -->
<div id="titlebar">
  <button type="button" class="wb-brand" id="appMenu" title="Critter Sounds menu" aria-label="Critter Sounds menu" aria-haspopup="menu"><span class="wb-logo logomark" aria-hidden="true"></span><svg class="wb-caret" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="wb-title" id="winTitle"></div>
  <div class="wb-ctl">
    <button type="button" class="wb-min" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 10 10"><path d="M0 5.5h10"/></svg></button>
    <button type="button" class="wb-max" title="Maximize" aria-label="Maximize"><svg class="sq" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg><svg class="rs" viewBox="0 0 10 10"><rect x=".5" y="2.5" width="7" height="7"/><path d="M2.5 2.5V.5h7v7h-2"/></svg></button>
    <button type="button" class="wb-close" title="Close" aria-label="Close"><svg viewBox="0 0 10 10"><path d="M.5.5l9 9M9.5.5l-9 9"/></svg></button>
  </div>
</div>
<header id="top">
  <div class="brand"><!--LOGO--></div>
  <form id="conn" class="conn" autocomplete="off">
    <label class="fld wide" title="The lobby owner finds it in Critter VTT's Music window"><span>Music code</span><input id="mcode" maxlength="60" spellcheck="false" placeholder="4TBCEF-EMJQE-SQSW5"></label>
    <button type="submit" id="connBtn" class="btn primary">Connect</button>
    <span id="connState" class="chip">Not connected</span>
  </form>
  <div class="topbtns">
    <button type="button" id="openBtn" class="btn primary" title="Add a window to the canvas: playlists, pads, soundscapes, effects…">＋ Windows</button>
    <button type="button" id="layoutBtn" class="btn" title="Ready-made sets of windows, and your saved ones">▦ Layouts</button>
    <button type="button" id="lanBtn" class="btn ghost" hidden aria-haspopup="menu"></button>
    <button type="button" id="helpBtn" class="btn ghost" title="Tours, setup and the Help window">Help</button>
    <button type="button" id="folderBtn" class="btn ghost" title="Open the Critter Sounds folder (music, downloads, loops)"></button>
    <button type="button" id="setBtn" class="btn ghost" title="Settings"></button>
    <button type="button" id="queueBtn" class="btn ghost" title="Show or hide the queue">☰ Queue</button>
    <button type="button" id="themeBtn" class="btn ghost" title="Colours: the highlight, a second highlight and the background">Look</button>
    <button type="button" id="hbBtn" class="btn ghost" title="Choose which Homebase to connect through">Homebase</button>
    <button type="button" id="miniBtn" class="btn ghost" title="A small player that stays on top (Ctrl+M)">Mini</button>
  </div>
</header>
<p id="connHint" class="connhint"></p>

<div id="main">
  <section id="canvas" aria-label="Windows"></section>
  <aside id="queue" aria-label="Queue"></aside>
</div>

<footer id="bar">
  <div id="barGlow" aria-hidden="true"></div>
  <div class="now">
    <div id="nowArt" class="nowart" aria-hidden="true"></div>
    <div id="nowTitle" class="nowtitle">Nothing playing</div>
    <div id="nowSub" class="nowsub"></div>
    <div class="seek"><span id="tCur" class="time">0:00</span><input type="range" id="seek" min="0" max="1" step="0.1" value="0" aria-label="Position in the track"><span id="tDur" class="time">0:00</span></div>
  </div>
  <div class="trans">
    <button type="button" id="shuffleBtn" class="tb" title="Shuffle" aria-pressed="false">⇄</button>
    <button type="button" id="prevBtn" class="tb" title="Previous (P)">⏮</button>
    <button type="button" id="playBtn" class="tb big" title="Play or pause (Space)">▶</button>
    <button type="button" id="stopBtn" class="tb" title="Stop with a fade; press again to stop at once (S)">⏹</button>
    <button type="button" id="nextBtn" class="tb" title="Next (N)">⏭</button>
    <button type="button" id="loopBtn" class="tb" title="Repeat">⟳</button>
  </div>
  <div class="vols">
    <div class="sl"><span title="How loud the music goes to the table">Table</span><input type="range" id="vol" min="0" max="100" aria-label="Volume for the table"><output id="volV"></output></div>
    <div class="sl"><label class="mini-chk" title="Hear the music on this computer too, with the effects"><input type="checkbox" id="monOn"> Here</label><input type="range" id="monVol" min="0" max="100" aria-label="Volume on this computer"><output id="monV"></output></div>
    <div class="meter" aria-hidden="true"><i id="meterL"></i><i id="meterR"></i></div>
  </div>
  <div class="extra">
    <select id="sleep" title="Sleep timer: fade out and stop after a while" aria-label="Sleep timer">
      <option value="0">No sleep timer</option><option value="15">Stop in 15 min</option><option value="30">Stop in 30 min</option><option value="45">Stop in 45 min</option><option value="60">Stop in 1 hour</option><option value="90">Stop in 1½ hours</option><option value="120">Stop in 2 hours</option>
    </select>
    <select id="sink" title="Where this computer plays it" aria-label="Output on this computer"></select>
  </div>
</footer>
<!-- the mini player's expandable Up next and small pads -->
<div id="miniX"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="i18n-de.js"></script>
<script src="i18n-de2.js"></script>
<script src="i18n-de3.js"></script>
<script src="i18n.js"></script>
<script src="fxpresets.js"></script>
<script src="scape.js"></script>
<script src="tour.js"></script>
<script src="fonts.js"></script>
<script src="app.js"></script>
<script src="notes-bridge.js"></script>
<script src="lan.js"></script>
<script src="mobile.js"></script>
</body>
</html>
